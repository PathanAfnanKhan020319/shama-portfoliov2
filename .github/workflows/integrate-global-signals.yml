name: Integrate global opportunity signals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-global-signals.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch About page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/about.js')
          text = path.read_text(encoding='utf-8')

          if 'const GlobalSignals = dynamic(' not in text:
              anchor = 'const Education = dynamic(() => import("@/components/Education"), { ssr: false });'
              if anchor not in text:
                  raise SystemExit('Education dynamic import anchor not found')
              text = text.replace(
                  anchor,
                  anchor + '\nconst GlobalSignals = dynamic(() => import("@/components/GlobalSignals"), { ssr: false });',
                  1,
              )

          if '<GlobalSignals />' not in text:
              pattern = re.compile(
                  r'(?P<indent>\s*)<DeferredSection\s+rootMargin="700px 0px"\s+minHeight=\{700\}\s*>\s*<Education\s*/>\s*</DeferredSection>',
                  re.S,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('Education DeferredSection anchor not found')

              indent = match.group('indent')
              block = (
                  f'{indent}<DeferredSection\n'
                  f'{indent}  rootMargin="900px 0px"\n'
                  f'{indent}  minHeight={{1500}}\n'
                  f'{indent}>\n'
                  f'{indent}  <GlobalSignals />\n'
                  f'{indent}</DeferredSection>\n\n'
                  f'{indent}<DeferredSection\n'
                  f'{indent}  rootMargin="700px 0px"\n'
                  f'{indent}  minHeight={{700}}\n'
                  f'{indent}>\n'
                  f'{indent}  <Education />\n'
                  f'{indent}</DeferredSection>'
              )
              text = text[:match.start()] + block + text[match.end():]

          path.write_text(text, encoding='utf-8')
          print('GlobalSignals integrated into About page.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "portfolio-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: showcase global opportunities and certifications"
            git push origin main
          fi
