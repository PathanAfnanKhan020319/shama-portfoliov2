name: Integrate global opportunity signals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-global-signals.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move GlobalSignals below About hero
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/about.js')
          text = path.read_text(encoding='utf-8')

          global_pattern = re.compile(
              r'\s*<DeferredSection\s+rootMargin="900px 0px"\s+minHeight=\{1500\}\s*>\s*<GlobalSignals\s*/>\s*</DeferredSection>\s*',
              re.S,
          )
          text, count = global_pattern.subn('\n\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one GlobalSignals section, found {count}')

          skills_pattern = re.compile(
              r'(?P<indent>\s*)<DeferredSection\s+rootMargin="900px 0px"\s+minHeight=\{900\}\s*>\s*<Skills\s*/>\s*</DeferredSection>',
              re.S,
          )
          match = skills_pattern.search(text)
          if not match:
              raise SystemExit('Skills DeferredSection anchor not found')

          indent = match.group('indent')
          global_block = (
              f'{indent}<DeferredSection\n'
              f'{indent}  rootMargin="900px 0px"\n'
              f'{indent}  minHeight={{1500}}\n'
              f'{indent}>\n'
              f'{indent}  <GlobalSignals />\n'
              f'{indent}</DeferredSection>\n\n'
          )

          text = text[:match.start()] + global_block + text[match.start():]
          path.write_text(text, encoding='utf-8')
          print('GlobalSignals moved before Skills, directly below the About hero transition.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "portfolio-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ux: place global signals directly below about hero"
            git push origin main
          fi
