name: Rebuild Afnan premium portfolio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-afnan-portfolio.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone premium portfolio
        run: git clone --depth 1 https://github.com/PathanAfnanKhan020319/shamama1.git /tmp/premium

      - name: Sync premium website
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude=.git --exclude=.github --exclude=scripts /tmp/premium/ ./

      - name: Apply Afnan changes
        run: python .github/rebuild_afnan.py

      - name: Commit and push
        run: |
          git config user.name portfolio-rebuild-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: rebuild Afnan portfolio with premium design" || exit 0
          git push origin main
