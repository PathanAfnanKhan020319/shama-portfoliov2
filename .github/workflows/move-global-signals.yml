name: Use Exact About THINK Portrait

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/move-global-signals.yml"

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point About page to exact uploaded portrait
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/about.js')
          text = path.read_text(encoding='utf-8')
          old = 'import profilePic from "../../public/images/profile/afnan-think.svg";'
          new = 'import profilePic from "../../public/images/profile/afnan-think-exact.jpg";'
          if old not in text:
              raise SystemExit('Current THINK portrait import not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('About page now uses exact uploaded THINK portrait JPEG.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "portfolio-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "design: use exact THINK portrait on about page"
            git push origin main
          fi
