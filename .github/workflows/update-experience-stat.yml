name: Update experience stat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-experience-stat.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update About experience stat
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/about.js')
          text = path.read_text(encoding='utf-8')

          old = '''              <StatCard
                value={3.5}
                suffix="+"
                label="Years Experience"
                sublabel="Applied AI Engineering"
                index={1}
              />'''

          new = '''              <StatCard
                value={4}
                suffix="+"
                label="Years Experience"
                sublabel="Applied AI Engineering"
                index={1}
              />'''

          if old not in text:
              raise SystemExit('Experience stat block not found or already updated')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Updated experience stat to 4+ years.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "portfolio-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about.js
          git commit -m "content: update experience to 4+ years"
          git push origin main
