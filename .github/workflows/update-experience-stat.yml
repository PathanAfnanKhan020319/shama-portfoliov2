name: Update experience stat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-experience-stat.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update About experience stat
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/pages/about.js')
          text = path.read_text(encoding='utf-8')

          if 'value={4}' in text and 'label="Years Experience"' in text:
              print('Experience stat already shows 4+ years.')
          elif 'value={3.5}' in text:
              text = text.replace('value={3.5}', 'value={4}', 1)
              path.write_text(text, encoding='utf-8')
              print('Updated experience stat to 4+ years.')
          else:
              raise SystemExit('Could not find the 3.5 years value to update')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "portfolio-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "content: update experience to 4+ years"
            git push origin main
          fi
